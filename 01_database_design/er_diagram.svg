<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="4" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1100" fill="url(#bgGrad)" />
  
  <!-- Grid Texture -->
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-width="1" />
    </pattern>
    <rect width="1600" height="1100" fill="url(#grid)" />
  </g>

  <!-- Title & Metadata -->
  <text x="50" y="50" fill="#38bdf8" font-family="Segoe UI, -apple-system, sans-serif" font-size="24" font-weight="bold">SMART DELIVERY OPERATIONS ANALYTICS — RELATIONAL ER DIAGRAM</text>
  <text x="50" y="80" fill="#94a3b8" font-family="Segoe UI, -apple-system, sans-serif" font-size="13">Database: smart_delivery_analytics | Target Engine: MySQL 8.0+ InnoDB | 3NF Operational Schema</text>

  <!-- ================= MASTER / DIMENSION TABLES ================= -->

  <!-- TABLE: customers -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="360" height="210" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 352 0 Q 360 0 360 8 L 360 40 L 0 40 Z" fill="#2563eb" />
    <text x="16" y="26" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">customers</text>
    <text x="270" y="26" fill="#bfdbfe" font-family="Segoe UI, sans-serif" font-size="12">1,000 rows</text>
    
    <g font-family="Consolas, monospace" font-size="12">
      <text x="16" y="66" fill="#fbbf24" font-weight="bold">[PK] customer_id</text><text x="230" y="66" fill="#94a3b8">INT UNSIGNED</text>
      <text x="16" y="92" fill="#e2e8f0">     customer_name</text><text x="230" y="92" fill="#94a3b8">VARCHAR(100)</text>
      <text x="16" y="118" fill="#e2e8f0">     age</text><text x="230" y="118" fill="#94a3b8">TINYINT UNSIGNED</text>
      <text x="16" y="144" fill="#e2e8f0">     gender</text><text x="230" y="144" fill="#94a3b8">ENUM(3)</text>
      <text x="16" y="170" fill="#e2e8f0">     city</text><text x="230" y="170" fill="#94a3b8">VARCHAR(50)</text>
      <text x="16" y="196" fill="#e2e8f0">     signup_date</text><text x="230" y="196" fill="#94a3b8">DATE</text>
    </g>
  </g>

  <!-- TABLE: customer_behavior (1:1 Extension) -->
  <g transform="translate(60, 380)" filter="url(#shadow)">
    <rect width="360" height="210" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 352 0 Q 360 0 360 8 L 360 40 L 0 40 Z" fill="#0d9488" />
    <text x="16" y="26" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">customer_behavior</text>
    <text x="270" y="26" fill="#ccfbf1" font-family="Segoe UI, sans-serif" font-size="12">1,000 rows</text>
    
    <g font-family="Consolas, monospace" font-size="12">
      <text x="16" y="66" fill="#fbbf24" font-weight="bold">[PFK] customer_id</text><text x="230" y="66" fill="#94a3b8">INT UNSIGNED</text>
      <text x="16" y="92" fill="#e2e8f0">      total_orders</text><text x="230" y="92" fill="#94a3b8">SMALLINT UNSIGNED</text>
      <text x="16" y="118" fill="#e2e8f0">      total_spending</text><text x="230" y="118" fill="#94a3b8">DECIMAL(10,2)</text>
      <text x="16" y="144" fill="#e2e8f0">      avg_order_value</text><text x="230" y="144" fill="#94a3b8">DECIMAL(10,2)</text>
      <text x="16" y="170" fill="#e2e8f0">      last_order_days</text><text x="230" y="170" fill="#94a3b8">SMALLINT UNSIGNED</text>
      <text x="16" y="196" fill="#e2e8f0">      churn_flag</text><text x="230" y="196" fill="#94a3b8">TINYINT(1)</text>
    </g>
  </g>

  <!-- TABLE: restaurants -->
  <g transform="translate(60, 630)" filter="url(#shadow)">
    <rect width="360" height="184" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 352 0 Q 360 0 360 8 L 360 40 L 0 40 Z" fill="#d97706" />
    <text x="16" y="26" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">restaurants</text>
    <text x="280" y="26" fill="#fef3c7" font-family="Segoe UI, sans-serif" font-size="12">100 rows</text>
    
    <g font-family="Consolas, monospace" font-size="12">
      <text x="16" y="66" fill="#fbbf24" font-weight="bold">[PK] restaurant_id</text><text x="230" y="66" fill="#94a3b8">SMALLINT UNSIGNED</text>
      <text x="16" y="92" fill="#e2e8f0">     restaurant_name</text><text x="230" y="92" fill="#94a3b8">VARCHAR(100)</text>
      <text x="16" y="118" fill="#e2e8f0">     cuisine_type</text><text x="230" y="118" fill="#94a3b8">VARCHAR(50)</text>
      <text x="16" y="144" fill="#e2e8f0">     city</text><text x="230" y="144" fill="#94a3b8">VARCHAR(50)</text>
      <text x="16" y="170" fill="#e2e8f0">     rating</text><text x="230" y="170" fill="#94a3b8">DECIMAL(2,1)</text>
    </g>
  </g>

  <!-- TABLE: delivery_partners -->
  <g transform="translate(60, 850)" filter="url(#shadow)">
    <rect width="360" height="160" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 352 0 Q 360 0 360 8 L 360 40 L 0 40 Z" fill="#7c3aed" />
    <text x="16" y="26" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">delivery_partners</text>
    <text x="280" y="26" fill="#ede9fe" font-family="Segoe UI, sans-serif" font-size="12">200 rows</text>
    
    <g font-family="Consolas, monospace" font-size="12">
      <text x="16" y="66" fill="#fbbf24" font-weight="bold">[PK] partner_id</text><text x="230" y="66" fill="#94a3b8">SMALLINT UNSIGNED</text>
      <text x="16" y="92" fill="#e2e8f0">     partner_name</text><text x="230" y="92" fill="#94a3b8">VARCHAR(100)</text>
      <text x="16" y="118" fill="#e2e8f0">     vehicle_type</text><text x="230" y="118" fill="#94a3b8">ENUM(4)</text>
      <text x="16" y="144" fill="#e2e8f0">     joining_date</text><text x="230" y="144" fill="#94a3b8">DATE</text>
    </g>
  </g>

  <!-- ================= CENTRAL FACT TABLE ================= -->

  <!-- TABLE: orders -->
  <g transform="translate(560, 340)" filter="url(#shadow)">
    <rect width="440" height="310" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 432 0 Q 440 0 440 8 L 440 40 L 0 40 Z" fill="#059669" />
    <text x="16" y="26" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">orders (Central Fact Ledger)</text>
    <text x="340" y="26" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="12">10,000 rows</text>
    
    <g font-family="Consolas, monospace" font-size="12">
      <text x="16" y="66" fill="#fbbf24" font-weight="bold">[PK]  order_id</text><text x="290" y="66" fill="#94a3b8">INT UNSIGNED</text>
      <text x="16" y="92" fill="#818cf8" font-weight="bold">[FK1] customer_id</text><text x="290" y="92" fill="#94a3b8">INT UNSIGNED</text>
      <text x="16" y="118" fill="#818cf8" font-weight="bold">[FK2] restaurant_id</text><text x="290" y="118" fill="#94a3b8">SMALLINT UNSIGNED</text>
      <text x="16" y="144" fill="#818cf8" font-weight="bold">[FK3] partner_id</text><text x="290" y="144" fill="#94a3b8">SMALLINT UNSIGNED</text>
      <text x="16" y="170" fill="#e2e8f0">      order_time</text><text x="290" y="170" fill="#94a3b8">DATETIME</text>
      <text x="16" y="196" fill="#e2e8f0">      delivered_time</text><text x="290" y="196" fill="#94a3b8">DATETIME NULL</text>
      <text x="16" y="222" fill="#e2e8f0">      order_amount</text><text x="290" y="222" fill="#94a3b8">DECIMAL(10,2)</text>
      <text x="16" y="248" fill="#e2e8f0">      delivery_fee</text><text x="290" y="248" fill="#94a3b8">DECIMAL(10,2)</text>
      <text x="16" y="274" fill="#e2e8f0">      status</text><text x="290" y="274" fill="#94a3b8">ENUM(3)</text>
      <text x="16" y="298" fill="#e2e8f0">      created_at</text><text x="290" y="298" fill="#94a3b8">TIMESTAMP</text>
    </g>
  </g>

  <!-- ================= SUB-FACT TABLES ================= -->

  <!-- TABLE: payments -->
  <g transform="translate(1140, 230)" filter="url(#shadow)">
    <rect width="400" height="175" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 392 0 Q 400 0 400 8 L 400 40 L 0 40 Z" fill="#0284c7" />
    <text x="16" y="26" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">payments (Financial Ledger)</text>
    <text x="310" y="26" fill="#bae6fd" font-family="Segoe UI, sans-serif" font-size="12">10,000 rows</text>
    
    <g font-family="Consolas, monospace" font-size="12">
      <text x="16" y="66" fill="#fbbf24" font-weight="bold">[PK]     payment_id</text><text x="270" y="66" fill="#94a3b8">INT UNSIGNED</text>
      <text x="16" y="92" fill="#818cf8" font-weight="bold">[FK, UQ] order_id</text><text x="270" y="92" fill="#94a3b8">INT UNSIGNED</text>
      <text x="16" y="118" fill="#e2e8f0">         payment_mode</text><text x="270" y="118" fill="#94a3b8">ENUM(5)</text>
      <text x="16" y="144" fill="#e2e8f0">         amount</text><text x="270" y="144" fill="#94a3b8">DECIMAL(10,2)</text>
      <text x="16" y="166" fill="#e2e8f0">         created_at</text><text x="270" y="166" fill="#94a3b8">TIMESTAMP</text>
    </g>
  </g>

  <!-- TABLE: ratings -->
  <g transform="translate(1140, 460)" filter="url(#shadow)">
    <rect width="400" height="175" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 392 0 Q 400 0 400 8 L 400 40 L 0 40 Z" fill="#e11d48" />
    <text x="16" y="26" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">ratings (Customer Feedback)</text>
    <text x="315" y="26" fill="#fecdd3" font-family="Segoe UI, sans-serif" font-size="12">7,000 rows</text>
    
    <g font-family="Consolas, monospace" font-size="12">
      <text x="16" y="66" fill="#fbbf24" font-weight="bold">[PK]     rating_id</text><text x="270" y="66" fill="#94a3b8">INT UNSIGNED</text>
      <text x="16" y="92" fill="#818cf8" font-weight="bold">[FK, UQ] order_id</text><text x="270" y="92" fill="#94a3b8">INT UNSIGNED</text>
      <text x="16" y="118" fill="#e2e8f0">         customer_rating</text><text x="270" y="118" fill="#94a3b8">DECIMAL(2,1)</text>
      <text x="16" y="144" fill="#e2e8f0">         feedback</text><text x="270" y="144" fill="#94a3b8">VARCHAR(255)</text>
      <text x="16" y="166" fill="#e2e8f0">         created_at</text><text x="270" y="166" fill="#94a3b8">TIMESTAMP</text>
    </g>
  </g>

  <!-- TABLE: data_ingestion_audit -->
  <g transform="translate(1140, 690)" filter="url(#shadow)">
    <rect width="400" height="210" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 392 0 Q 400 0 400 8 L 400 40 L 0 40 Z" fill="#475569" />
    <text x="16" y="26" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">data_ingestion_audit</text>
    <text x="290" y="26" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">Audit Ledger</text>
    
    <g font-family="Consolas, monospace" font-size="12">
      <text x="16" y="66" fill="#fbbf24" font-weight="bold">[PK] audit_id</text><text x="270" y="66" fill="#94a3b8">BIGINT UNSIGNED</text>
      <text x="16" y="92" fill="#e2e8f0">     batch_id</text><text x="270" y="92" fill="#94a3b8">VARCHAR(64)</text>
      <text x="16" y="118" fill="#e2e8f0">     source_entity</text><text x="270" y="118" fill="#94a3b8">VARCHAR(64)</text>
      <text x="16" y="144" fill="#e2e8f0">     target_table</text><text x="270" y="144" fill="#94a3b8">VARCHAR(64)</text>
      <text x="16" y="170" fill="#e2e8f0">     operation_type</text><text x="270" y="170" fill="#94a3b8">ENUM(4)</text>
      <text x="16" y="196" fill="#e2e8f0">     status</text><text x="270" y="196" fill="#94a3b8">ENUM(3)</text>
    </g>
  </g>

  <!-- ================= RELATIONSHIP CONNECTOR PATHS ================= -->

  <!-- 1. customers (1) -> customer_behavior (1) [Vertical Dashed] -->
  <path d="M 240 340 L 240 380" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#dot)" />
  <text x="248" y="365" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">1 : 1</text>

  <!-- 2. customers (1) -> orders (M) -->
  <path d="M 420 196 L 490 196 L 490 432 L 560 432" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="495" y="300" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">1 : M</text>

  <!-- 3. restaurants (1) -> orders (M) -->
  <path d="M 420 722 L 500 722 L 500 458 L 560 458" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="505" y="600" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">1 : M</text>

  <!-- 4. delivery_partners (1) -> orders (M) -->
  <path d="M 420 930 L 520 930 L 520 484 L 560 484" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="525" y="780" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">1 : M</text>

  <!-- 5. orders (1) -> payments (1) -->
  <path d="M 1000 406 L 1070 406 L 1070 322 L 1140 322" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#dot)" />
  <text x="1075" y="355" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">1 : 1</text>

  <!-- 6. orders (1) -> ratings (0..1) -->
  <path d="M 1000 406 L 1070 406 L 1070 552 L 1140 552" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="1075" y="500" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">1 : 0..1</text>

  <!-- ================= LEGEND & STANDARDS ================= -->
  <g transform="translate(60, 970)">
    <rect width="1480" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="30" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">DATA MODEL NOTATION &amp; INTEGRITY STANDARDS:</text>
    
    <g transform="translate(24, 52)" font-family="Segoe UI, sans-serif" font-size="12">
      <circle cx="8" cy="-4" r="5" fill="#fbbf24" />
      <text x="20" y="0" fill="#e2e8f0"><tspan font-weight="bold">[PK]</tspan> Primary Key</text>
      
      <circle cx="160" cy="-4" r="5" fill="#818cf8" />
      <text x="172" y="0" fill="#e2e8f0"><tspan font-weight="bold">[FK]</tspan> Foreign Key</text>
      
      <line x1="310" y1="-4" x2="350" y2="-4" stroke="#38bdf8" stroke-width="2.5" />
      <text x="360" y="0" fill="#e2e8f0">1 : M (One-to-Many)</text>
      
      <line x1="510" y1="-4" x2="550" y2="-4" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" />
      <text x="560" y="0" fill="#e2e8f0">1 : 1 (One-to-One Extension)</text>
      
      <text x="800" y="0" fill="#38bdf8" font-weight="bold">Referential Policy: ON UPDATE CASCADE | ON DELETE RESTRICT (Orders) | ON DELETE CASCADE (Behavior)</text>
    </g>
  </g>
</svg>
